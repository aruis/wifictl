name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: run tests
        run: go test ./...

  build-release:
    name: build release
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            asset_suffix: Darwin_arm64
          - goos: darwin
            goarch: amd64
            asset_suffix: Darwin_x86_64
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          go build -trimpath -ldflags="-s -w -X github.com/aruis/wifictl/internal/buildinfo.Version=${VERSION} -X github.com/aruis/wifictl/internal/buildinfo.Commit=${COMMIT} -X github.com/aruis/wifictl/internal/buildinfo.Date=${BUILD_TIME}" -o "dist/wifictl" ./

      - name: package archive
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE_DIR="release/wifictl_${VERSION}_${ASSET_SUFFIX}"
          mkdir -p "${STAGE_DIR}"
          cp dist/wifictl "${STAGE_DIR}/"
          cp README.md README.zh-CN.md "${STAGE_DIR}/"
          tar -C release -czf "wifictl_${VERSION}_${ASSET_SUFFIX}.tar.gz" "wifictl_${VERSION}_${ASSET_SUFFIX}"

      - name: upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifictl_${{ matrix.asset_suffix }}
          path: wifictl_${{ github.ref_name }}_${{ matrix.asset_suffix }}.tar.gz

  publish-release:
    name: publish release
    needs: build-release
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets

      - name: publish github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          find dist-assets -type f -name '*.tar.gz' -exec cp {} . \;
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" ./*.tar.gz --clobber
          else
            gh release create "${VERSION}" ./*.tar.gz --title "${VERSION}"
          fi
